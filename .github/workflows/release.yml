name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hotd4-release
  cancel-in-progress: false
jobs:
  windows-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows PowerShell 5.1 installer recovery
        shell: powershell
        run: ./.release/test_setup_support.ps1
      - name: Test Windows game discovery and handoff settings
        shell: powershell
        run: ./.release/test_game_library.ps1
      - name: Test keyboard player bindings and saved preferences
        shell: powershell
        run: ./.release/test_keyboard_controls.ps1
      - name: Test complete display menus and saved preferences
        shell: powershell
        run: ./.release/test_display_controls.ps1
      - name: Test update progress, window switching and cancellation
        shell: powershell
        run: ./.release/test_update_progress.ps1
      - name: Test legacy install upgrade and launch
        shell: powershell
        run: ./.release/test_update_dump_path.ps1
      - name: Test remembered Setup folders and Browse controls
        shell: powershell
        run: ./.release/test_setup_paths.ps1
      - name: Test build progress and memory limits
        run: python .release/test_build_support.py -v
  publish:
    needs: windows-checks
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
      - name: Test release publishing
        run: python3 .release/test_publish.py -v
      - name: Test isolated Python dependency setup
        run: python3 .release/test_python_deps.py -v
      - name: Test build progress and memory limits
        run: python3 .release/test_build_support.py -v
      - name: Test verified operator executable discovery
        run: python3 .release/test_operator_elf.py -v
      - name: Test streaming audio ring positions
        run: |
          cc -std=c11 -Wall -Wextra -Werror .release/test_sega_audio_position.c -lm -o /tmp/hotd4-audio-position-test
          /tmp/hotd4-audio-position-test
      - name: Test independent keyboard aiming
        run: |
          cc -std=c11 -Wall -Wextra -Werror .release/test_keyboard_aim.c -lm -o /tmp/hotd4-keyboard-test
          /tmp/hotd4-keyboard-test
      - name: Test mouse shake gestures
        run: |
          cc -std=c11 -Wall -Wextra -Werror .release/test_mouse_shake.c -o /tmp/hotd4-mouse-shake-test
          /tmp/hotd4-mouse-shake-test
      - name: Test mixed co-op mouse isolation
        run: |
          cc -std=c11 -Wall -Wextra -Werror .release/test_coop_mouse.c -lm -o /tmp/hotd4-coop-mouse-test
          /tmp/hotd4-coop-mouse-test
      - name: Test solo character input assignment
        run: |
          cc -std=c11 -Wall -Wextra -Werror .release/test_solo_player.c -o /tmp/hotd4-solo-player-test
          /tmp/hotd4-solo-player-test
      - name: Test arcade high score record decoding
        run: |
          cc -std=c11 -Wall -Wextra -Werror .release/test_high_scores.c -o /tmp/hotd4-high-score-test
          /tmp/hotd4-high-score-test
      - name: Test opt-in OpenXR diagnostic capture
        run: |
          cc -std=c11 -Wall -Wextra -Werror .release/test_xr_capture.c source/lindberghrecomp/src/runtime/xr_controls.c -o /tmp/hotd4-xr-capture-test
          /tmp/hotd4-xr-capture-test
      - name: Test interruption-safe cabinet saves
        run: |
          cc -std=c11 -Wall -Wextra -Werror .release/test_atomic_file.c -o /tmp/hotd4-atomic-save-test
          /tmp/hotd4-atomic-save-test /tmp/hotd4-atomic-cabinet.bin
      - name: Test off-screen reload and gameplay settings
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wno-array-parameter .release/test_gameplay.c source/lindberghrecomp/src/runtime/gameplay_options.c source/lindberghrecomp/src/runtime/xr_controls.c source/lindberghrecomp/src/runtime/xr_settings.c source/lindberghrecomp/src/runtime/xr_panel.c source/lindberghrecomp/src/runtime/xr_menu.c source/lindberghrecomp/src/runtime/stereo_projection.c -lm -o /tmp/hotd4-gameplay-test
          mkdir -p /tmp/hotd4-gameplay-profiles
          cd /tmp/hotd4-gameplay-profiles && /tmp/hotd4-gameplay-test
      - name: Verify package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release/publish.py
